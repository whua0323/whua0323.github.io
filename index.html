: "华尔街日报8月9日援引知情人士报道，苹果对长鑫存储内存芯片的测试已覆盖iPhone、MacBook等多条产品线并初步洽谈供应，目标用于中国市场销售设备；惠普、宏碁已在美国以外采用长鑫芯片并寻求锁定明年供应，长鑫今年产能已售罄、定价与美光、三星、海力士持平或略高。国产存储获全球头部终端验证，存储国产替代与消费级DRAM供应偏紧信号同步强化，利好A股存储及半导体产业链国产化预期；苹果合作仍处测试洽谈阶", "why": "苹果、惠普、宏碁导入验证国产DRAM获头部终端认可，长鑫产能售罄、定价追平海外大厂，国产替代与消费级DRAM涨价两变量同向：核心映射长鑫科技，设备材料、利基存储、模组与接口链受益；苹果订单仍处测试洽谈，落地节奏待观察。", "tags": ["长鑫验证扩产"]}, {"title": "DeepSeek拟大幅上调API定价，国产开源模型进入“大分成时代”", "time": "2026-08-10 07:00:00", "source": "进门晨报", "url": "", "body": "8月6日，DeepSeek公告计划近期整体上调API服务定价、预计涨幅较大；同期Kimi K3商用许可证发布，据IT之家报道阿里或对下一代通义千问大型商用用户收取收益分成，机构将行业解读为从低价获客转向收入分成的“大分成时代”。测算显示，Token分成模式下算力租赁回收期可缩至约2年、Token服务收入有望达传统租赁5-10倍、净利率或升至30%以上，开源模型公司与算力租赁厂商为主要受益方向；阿里", "why": "DeepSeek提价叠加Kimi K3商用许可与阿里千问分成，行业从价格战转向价值定价：开源模型公司直接受益定价权修复，算力租赁在Token分成下回收期缩至约2年、净利率升至30%以上，并拉动国产算力需求；下游应用短期成本承压但可自部署开源模型对冲，阿里分成未落地存不确定性。", "tags": ["开源模型涨价"]}, {"title": "磷化铟衬底三季度缺口显现 通美提价 3英寸报价约4500元", "time": "2026-08-10 07:00:00", "source": "进门晨报", "url": "", "body": "8月9日专家交流确认三季度磷化铟衬底供需缺口显现：龙头通美逐步提价，3英寸最新报价约4500元/片，预计年内再涨1-2次；外延采购难度加大、海外高端设备已订满，扩产预计低于预期，800G/1.6T高速光模块衬底缺口清晰。上游电子级红磷（6N约4800元/公斤、日系控量）与高纯铟（2024年初以来累计涨约180%）景气上行，利好云南锗业、光智科技、兴发集团等产业链标的。", "why": "通美提价落地、3寸衬底约4500元且年内预计再涨，直接利好AXT及国产衬底龙头云南锗业、光智科技；缺口上溯至电子级红磷（日系控量）与高纯铟（2024年以来涨约180%），利好兴发集团、锡业股份、豫光金铅；海外设备订满带动国产切磨抛设备需求。", "tags": ["磷化铟提价"]}, {"title": "非农走弱叠加央行购金加速 金价转入右侧上行", "time": "2026-08-10 07:00:00", "source": "进门晨报", "url": "", "body": "截至8月7日当周，COMEX金价周涨7.2%至4401美元/盎司，SPDR黄金ETF持仓周增10.53吨；驱动来自美国7月非农大幅不及预期、5/6月合计下修10.3万人，9月加息预期回落，叠加中国央行7月增持黄金约19.9吨、连续第21个月增持且力度较6月放大。多家机构判断金价已在约4000美元企稳并转入右侧上行，美元信用叙事回归，黄金板块有望进入金价、估值修复与产量兑现共振阶段。", "why": "金价周涨7.2%站上4400，非农走弱叠加央行连续21个月购金提速，右侧上行逻辑确认。金矿股量价齐升、估值与产量兑现共振为核心受益（赤峰高弹性、紫金/山东黄金龙头）；黄金ETF及投资需求同向受益；高金价对珠宝零售量端形成压制，估值修复与需求收缩并存，呈多空交织。", "tags": ["金价右侧上行"]}, {"title": "英伟达VR200机柜8-9月加速爬坡 出货与业绩预期上修", "time": "2026-08-10 07:00:00", "source": "进门晨报", "url": "", "body": "据机构供应链跟踪，英伟达VR200机柜进入新品爬坡期：上游物料6月下旬启动拉货，8-9月高速爬坡，预计10月左右密集向下游交付；ODM龙头上修2027年VR200机柜出货预期至接近10万柜，PCB龙头预计三季度业绩环比增长50%甚至翻倍。机构判断8-9月拉货备货推进将使产业链景气度非线性加速并带动EPS上修，投资优先级为PCB>ODM>光模块>电源/液冷，其中PCB三季度利润释放确定性最强。以上为", "why": "VR200机柜8-9月高速爬坡叠加2027出货上修至近10万柜，景气沿英伟达→PCB→ODM→光模块→电源/液冷传导并带动EPS上修；PCB三季度弹性最确定为核心抓手，ODM兑现偏9月后，光模块与电源/液冷为次顺位衍生。整机稼动Q3仍处试产、Q4才达90%以上，物料端与整机端口径存阶段分歧。", "tags": ["Rubin爬坡"]}, {"title": "台积电8英寸产能转CoWoS致DrMOS紧缺 涨价趋势或持续1.5-2年", "time": "2026-08-10 07:00:00", "source": "进门晨报", "url": "", "body": "东吴证券电子团队8月9日点评：台积电将8英寸BCD产能系统性转向CoWoS先进封装，海外DrMOS供给呈结构性不可逆收缩；AI算力放量、服务器功率升级及光模块DSP供电新增需求，行业涨价趋势预计维持1.5-2年。天风等多机构及产业链调研交叉验证：交期已拉长至30-45周，海外供应商年内多轮涨价（单次约10%-30%）。国产替代加速，杰华特、晶丰明源、芯朋微等标的受益，DrMOS为模拟芯片中AI关联", "why": "供给收缩与AI需求扩容并存：国产替代链上杰华特、晶丰明源、芯朋微同享提价与份额双逻辑，为弹性最优环节；海外MPS、英飞凌为涨价直接受益方但受8英寸产能与替代约束；上游华虹等8英寸代工承接国产订单，稼动率与ASP共振。焦点在涨价持续性。", "tags": ["DrMOS涨价"]}, {"title": "8月电子布涨价加速落地，年内累计涨幅超140%", "time": "2026-08-10 07:00:00", "source": "进门晨报", "url": "", "body": "8月电子布涨价加速落地：7628电子布价格涨至10-10.4元/米，单月上涨1.5-2元、年内累计涨幅超140%，较6月明显提速。涨价由供给约束与AI需求共振驱动——丰田织机交货周期排至两年后、高端产能挤占低端供给，叠加英伟达Rubin等AI服务器放量拉动PCB用布，电子纱至覆铜板涨价传导链已打开，机构预计9月续涨、景气或延续至2027年。龙头中国巨石满产满销、8月单米再涨1.5元，业绩兑现进入加", "why": "电子布8月加速涨价、年内累计超140%，丰田织机交期排至2028年后叠加AI服务器放量共振，电子纱→电子布→覆铜板传导链全开。直接受益纱布一体化龙头（中国巨石、宏和、中材、国际复材），覆铜板顺价传导受益，上游国产织机获替代窗口但批量放量或在2027年后。", "tags": ["电子布涨价"]}, {"title": "美国禁废钨出口，钨战略价值重估与国产刀具替代提速", "time": "2026-08-10 07:00:00", "source": "进门晨报", "url": "", "body": "美国依据联邦公报规定自8月下旬起禁止出口钨废料及回收电池材料，强制本土销售、为期一年，特朗普同期召集全球矿企高管商讨关键矿产供应。海外仲钨酸铵（APT）价格7月后已升至国内3倍以上，京瓷、住友等海外刀具厂商8-9月陆续提价，章源钨业同步上调长单报价。机构判断钨资源战略价值重估、钨价有望上行，国产刀具保供与成本优势凸显，进口替代有望加速，钨产业链关注度提升。", "why": "美国废钨出口禁令收缩海外再生钨供给，APT价差走阔至国内3倍以上，钨价上行直接利好上游钨资源与APT冶炼（章源长单上调印证）；海外刀具集体提价凸显国产性价比，数控刀具与硬质合金进口替代加速；六氟化钨价格大涨近3倍，半导体特气国产化受益。替代兑现与提价名单待验证。", "tags": ["钨价重估"]}, {"title": "东吴金属看高锡价至50万元/吨 判断9月底供需矛盾集中爆发", "time": "2026-08-10 07:00:00", "source": "进门晨报", "url": "", "body": "东吴证券金属团队8月9日周观点称，周内锡价已触及44万元/吨，判断9月底前供需矛盾集中爆发，锡价有望升至50万元/吨以上，并建议关注锡业股份、华锡有色、兴业银锡、新金路。多家券商交叉验证供给偏紧：沪锡库存自6月初1.23万吨降至约0.54万吨，缅甸、印尼等海外增量兑现度低，旺季现货紧缺或加深。需注意预测分歧仍存，亦有券商测算全球精锡缺口近5000吨，但认为锡价40万元/吨有支撑、41万元/吨有压力", "why": "锡价上行传导至锡矿自供环节：供给约束、库存去化与逼仓风险推升价格中枢，锡业股份、华锡有色、兴业银锡直接受益，新金路资源重估弹性大但在建未达产；下游锡膏锡粉AI用量与原料成本抬升并存，列为观察。东吴看50万元/吨以上、华福看40/41万元区间，分歧并列、不做净额化。", "tags": ["锡价上行"]}, {"title": "华为昇腾950DT良率升至50%，万亿参数训练将自主可控", "time": "2026-08-10 07:00:00", "source": "进门晨报", "url": "", "body": "产业会议纪要披露，华为昇腾950DT经设计优化将芯片良率由910C约15%提升至50%，配自研HBM3，CoWoS封装产能已解决、量产供应获保障；华为超节点已达8192卡（英伟达72卡），并给出2026年9月起万亿至10万亿参数大模型训练自主可控、无需依赖英伟达算力的时间表。国产算力竞争正从单卡转向系统算力与超节点能力，利好国产算力、先进封装、存储及光互联产业链；生产细节与时间表属单一渠道纪要信息", "why": "昇腾950DT良率升至50%、自研HBM3与CoWoS产能解决，直接强化国产算力量产供给；超节点8192卡与万亿参数训练自主可控时点，使受益主线沿超节点整机、先进封装、HBM存储、交换芯片与光互联扩散，整机与封装弹性最直接。生产细节与时间表属单一渠道纪要口径、未经华为官方确认，英伟达链需求分流与兑现节奏需跟踪。", "tags": ["昇腾超节点"]}, {"title": "2027年1.6T光模块出货预期上修 上游物料约束放量", "time": "2026-08-10 07:00:00", "source": "进门晨报", "url": "", "body": "中金公司调研纪要显示，2027年1.6T光模块出货预期近一个月内由7000万-8000万只上修至9000万-1亿只，订单口径或累积超1亿只；最终出货仍受1.6T DSP、高功率激光器、高速EML等上游核心物料约束，该预期按上游物料与AI芯片配套测算。北美云厂商财报验证需求加速、前期砍单担忧缓解，机构判断光模块龙头三季度EPS呈非线性加速，中际旭创、新易盛等核心标的业绩确定性上行。", "why": "2027年1.6T出货预期上修至9000万-1亿只，直接利好光模块龙头Q3业绩非线性加速；DSP、高速EML、高功率激光器等上游物料供给紧张，卡位环节享量价弹性。需求上修与供给瓶颈并存，兑现节奏取决于上游放量，且上修为机构调研口径、最终出货受物料约束。", "tags": ["1.6T出货上修"]}, {"title": "锐捷为阿里定制交换机CPO落地，云厂规模化部署在即", "time": "2026-08-10 07:00:00", "source": "进门晨报", "url": "", "body": "据锐捷网络学习会议纪要，锐捷为阿里定制、采用盛科芯片的交换机形态CPO已落地，为国内首个案例，阿里将成为国内首个规模化部署CPO的云厂商。华为CPO不对外供应，云厂定制化CPO需求将由锐捷（第一顺位）、紫光（第二顺位）承接；CPO时代光模块价值向交换机厂商转移，叠加超节点放量，交换机厂商价值重估主线强化，关注锐捷、紫光及光通信产业链。", "why": "阿里定制CPO落地催化云厂CPO放量：锐捷（直接主体、第一顺位）与紫光（第二顺位）承接云厂定制需求，华为自供不对外，超节点放量强化交换机价值重估；上游盛科芯片与光引擎“卖铲”环节受益；CPO时代光模块价值向交换机厂商转移，可插拔光模块多空交织（NPO/LPO仍放量）。核心抓手为锐捷、紫光、盛科，天孚及光模块承压为衍生观察。", "tags": ["CPO交换机"]}, {"title": "三星HBM4良率半年升至80%，年底份额目标约38%", "time": "2026-08-10 07:00:00", "source": "进门晨报", "url": "", "body": "三星电子HBM4量产提速是当前HBM供应格局的关键边际变化：据韩国媒体及公司2Q26业绩会披露，HBM4良率在量产约6个月内由不足60%升至80%，公司计划Q3 HBM4收入环比增超3倍、下半年收入占比达60%以上，年底HBM整体份额目标约38%；叠加SK海力士放缓HBM4扩产，机构测算三星全年HBM份额由27%升至37%。对HBM材料、设备、先进封装及存储产业链相关标的，供应格局与竞争节奏变化值", "why": "三星HBM4放量与良率爬坡重构HBM供应格局：三星直接受益，SK海力士放缓扩产而份额承压，美光中性；上游材料、设备与先进封装随放量景气上行，AI算力芯片供给边际改善。三星抢份额与海力士让产并存，良率数字未经官方确认，属边际竞争变量。", "tags": ["HBM4 function renderSpark(series, color){
  if(!series || series.length<2) return '';
  const W=240,H=44,pad=4;
  const vals=series.map(s=>s[1]);
  const lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals), span=(hi-lo)||1;
  const n=series.length;
  const X=i=>pad+(W-2*pad)*(n>1?i/(n-1):0.5);
  const Y=v=>pad+(H-2*pad)*(1-(v-lo)/span);
  const pts=series.map((s,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(s[1]).toFixed(1)}`).join(' ');
  const c2=color||'#4d8dff';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${pts}" fill="none" stroke="${c2}" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="${X(n-1).toFixed(1)}" cy="${Y(vals[n-1]).toFixed(1)}" r="2.2" fill="${c2}"/></svg>`;
}

const fw = document.getElementById('floatwin');
const fbody = document.getElementById('floatBody');
let fwTimer = null;
function showFloat(html, anchor){
  fbody.innerHTML = html;
  fw.style.display = 'block';
  fw.style.visibility = 'hidden';
  const r = anchor.getBoundingClientRect();
  const fwW = fw.offsetWidth, fwH = fw.offsetHeight;
  const vw = window.innerWidth, vh = window.innerHeight;
  let left = r.left + r.width/2 - fwW/2;
  let top = r.bottom + 10;
  if(left < 8) left = 8;
  if(left + fwW > vw - 8) left = vw - fwW - 8;
  if(top + fwH > vh - 8) top = r.top - fwH - 10;
  if(top < 8) top = 8;
  fw.style.left = left + 'px';
  fw.style.top = top + 'px';
  fw.style.visibility = 'visible';
  clearTimeout(fwTimer);
}
function hideFloat(){ fwTimer = setTimeout(()=>{ fw.style.display='none'; }, 160); }
fw.addEventListener('mouseenter', ()=>clearTimeout(fwTimer));
fw.addEventListener('mouseleave', ()=>{ fw.style.display='none'; });

// 锚定资产历史走势浮窗（日线序列，非分时；期货/外汇 24h 连续交易，分时口径与卡片收盘不同源，故不采用分时）
function anchorFloatHtml(a){
  const isYield = a.kind==='yield';
  const unit = isYield ? '%' : '';
  const chg = isYield
    ? (a.bp==null?'--':(a.bp>0?'+':'')+fmt(a.bp,1)+' bp')
    : (a.pct==null?'--':sign(a.pct)+fmt(a.pct)+'%');
  const cur = a.value==null ? '--' : fmt(a.value)+unit;
  const n = (a.series||[]).length;
  const sub = `${a.date||''} ｜ ${isYield?'收益率':'收盘'} ${cur}（${chg}）｜ ${a.sub||''}`;
  return `<div class="fw-head">${a.label} 近 ${n} 个交易日走势</div><div class="fw-sub">${sub}</div>${renderAnchorTrend(a)}`;
}
function renderAnchorTrend(a){
  const s = (a.series||[]).filter(x=>x && x[1]!=null);
  if(s.length<2) return '<div class="nodata">暂无历史走势数据</div>';
  const W=640,H=300,padL=10,padR=10,padT=16,padB=26;
  const vals = s.map(x=>x[1]);
  const lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals), span=(hi-lo)||1;
  const n=s.length;
  const X=i=>padL+(W-padL-padR)*(n>1?i/(n-1):0.5);
  const Y=v=>padT+(H-padT-padB)*(1-(v-lo)/span);
  const dp = s.map((x,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(x[1]).toFixed(1)}`).join(' ');
  const fill = dp + ` L${X(n-1).toFixed(1)} ${(H-padB).toFixed(1)} L${X(0).toFixed(1)} ${(H-padB).toFixed(1)} Z`;
  const chgVal = a.kind==='yield' ? a.bp : a.pct;
  const color = (chgVal==null||chgVal>=0) ? '#ff4d4f' : '#2ecc71';
  const base = vals[0], yb = Y(base).toFixed(1);
  const unit = a.kind==='yield' ? '%' : '';
  const md = d => (d||'').slice(5);
  const xt = [0, Math.floor(n/2), n-1].filter((v,i,arr)=>arr.indexOf(v)===i);
  const ticks = xt.map(i=>`<text x="${X(i).toFixed(1)}" y="${H-8}" fill="#5f6c8e" font-size="11" text-anchor="${i===0?'start':(i===n-1?'end':'middle')}">${md(s[i][0])}</text>`).join('');
  return `<svg class="intra-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="0" y1="${Y(hi).toFixed(1)}" x2="${W}" y2="${Y(hi).toFixed(1)}" stroke="#243055" stroke-width="1"/>
    <line x1="0" y1="${Y(lo).toFixed(1)}" x2="${W}" y2="${Y(lo).toFixed(1)}" stroke="#243055" stroke-width="1"/>
    <line x1="0" y1="${yb}" x2="${W}" y2="${yb}" stroke="#5f6c8e" stroke-dasharray="3,3" stroke-width="1"/>
    <path d="${fill}" fill="${color}" opacity="0.12"/>
    <path d="${dp}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="4" y="${(Y(hi)+12).toFixed(1)}" fill="#9aa7c7" font-size="10">${fmt(hi)}${unit}</text>
    <text x="4" y="${(Y(lo)-4).toFixed(1)}" fill="#9aa7c7" font-size="10">${fmt(lo)}${unit}</text>
    <text x="4" y="${(parseFloat(yb)-4).toFixed(1)}" fill="#5f6c8e" font-size="10">起点 ${fmt(base)}${unit}</text>
    ${ticks}
  </svg>
  <div class="intra-legend">区间 ${fmt(lo)}${unit} ~ ${fmt(hi)}${unit} ｜ 共 ${n} 个交易日 ｜ 数据：${a.source==='em'?'东方财富':'Wind'}</div>`;
}

// 板块融资融券单栏浮窗：板块内融资净买入前3（clist 板块成员 ∩ 全市场两融榜，按 RZJME 降序）
function sectorMarginFloatHtml(r){
  const yi = n=>n==null?'--':Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
  const c = n=>(n==null?'flat-c':(n>0.0001?'up-c':(n<-0.0001?'down-c':'flat-c')));
  const is3d = r.period === '3d';
  const netLabel = is3d ? '近3日合计(亿)' : '融资净买入(亿)';
  const subPrefix = is3d ? '近3日融资净买入' : '当日融资净买入';
  const headLabel = is3d ? '板块内近3日融资净买入前3' : '板块内融资净买入前3';
  const emptyMsg = is3d ? '该板块近3日暂无融资净买入个股数据' : '该板块当日暂无融资净买入个股数据';
  const sub = `行业板块 ｜ ${subPrefix} ${(r.net_yi==null?'--':(r.net_yi>0?'+':'')+yi(r.net_yi)+' 亿')} ｜ 融资余额 ${yi(r.balance_yi)} 亿 ｜ 数据：东方财富`;
  const mgn = (r.stocks||[]).slice(0,3);
  const body = !mgn.length ? `<div class="nodata">${emptyMsg}</div>` :
    `<table class="stock-tbl"><thead><tr><th>#</th><th>个股</th><th>${netLabel}</th><th>融资余额(亿)</th></tr></thead><tbody>` +
    mgn.map((x,i)=>`<tr><td><span class="stock-rank">${i+1}</span></td><td>${x.name||'--'}</td><td class="${c(x.net_yi)}">${(x.net_yi==null?'--':(x.net_yi>0?'+':'')+yi(x.net_yi)+' 亿')}</td><td>${yi(x.balance_yi)}</td></tr>`).join('') +
    '</tbody></table>';
  return `<div class="fw-head">${r.name} · ${headLabel}</div><div class="fw-sub">${sub}</div>${body}`;
}
// 板块行 hover 绑定
(function(){
  const s = DATA.sector || {};
  const all = [].concat(s.inflow||[], s.outflow||[]);
  document.querySelectorAll('#sgrid .srow.clickable').forEach(row=>{
    const bk = row.getAttribute('data-bk');
    const r = all.find(x=>x.bk===bk);
    if(!r) return;
    row.addEventListener('mouseenter', ()=>showFloat(sectorFloatHtml(r), row));
    row.addEventListener('mouseleave', hideFloat);
  });
})();

// 内联 SVG 画分时折线（零外部依赖）
function renderIntra(d, idx){
  if(!d || !d.vals || !d.vals.length) return '<div class="nodata">暂无分时数据</div>';
  const W=640,H=300,padL=10,padR=10,padT=16,padB=26;
  const vals = d.vals.filter(v=>v!=null);
  if(!vals.length) return '<div class="nodata">暂无分时数据</div>';
  const base = (d.pre_close!=null)? d.pre_close : vals[0];
  const lo = Math.min.apply(null, vals.concat([base]));
  const hi = Math.max.apply(null, vals.concat([base]));
  const span = (hi-lo)||1;
  const n = d.vals.length;
  const X = i => padL + (W-padL-padR)*(n>1 ? i/(n-1) : 0.5);
  const Y = v => padT + (H-padT-padB)*(1-(v-lo)/span);
  const pts = d.vals.map((v,i)=> (v==null? null : [X(i),Y(v)]));
  let dp='', started=false;
  pts.forEach(p=>{ if(p==null){started=false;return;} dp += (started?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)+' '; started=true; });
  const fill = dp + `L${X(n-1).toFixed(1)} ${(H-padB).toFixed(1)} L${X(0).toFixed(1)} ${(H-padB).toFixed(1)} Z`;
  const color = (idx.pct==null||idx.pct>=0)? '#ff4d4f' : '#2ecc71';
  const yb = Y(base).toFixed(1);
  const xticks = [0, Math.floor(n/2), n-1].filter((v,i,a)=>a.indexOf(v)===i);
  const ticks = xticks.map(i=>`<text x="${X(i).toFixed(1)}" y="${H-8}" fill="#5f6c8e" font-size="11" text-anchor="${i===0?'start':(i===n-1?'end':'middle')}">${d.times[i]||''}</text>`).join('');
  const yTop = Y(hi).toFixed(1), yBot = Y(lo).toFixed(1);
  return `<svg class="intra-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="0" y1="${yTop}" x2="${W}" y2="${yTop}" stroke="#243055" stroke-width="1"/>
    <line x1="0" y1="${yBot}" x2="${W}" y2="${yBot}" stroke="#243055" stroke-width="1"/>
    <line x1="0" y1="${yb}" x2="${W}" y2="${yb}" stroke="#5f6c8e" stroke-dasharray="3,3" stroke-width="1"/>
    <path d="${fill}" fill="${color}" opacity="0.12"/>
    <path d="${dp}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="4" y="${(Y(hi)+12).toFixed(1)}" fill="#9aa7c7" font-size="10">${fmt(hi)}</text>
    <text x="4" y="${(Y(lo)-4).toFixed(1)}" fill="#9aa7c7" font-size="10">${fmt(lo)}</text>
    <text x="4" y="${(parseFloat(yb)-4).toFixed(1)}" fill="#5f6c8e" font-size="10">昨收 ${fmt(base)}</text>
    ${ticks}
  </svg>
  <div class="intra-legend">昨收 <b>${fmt(base)}</b> ｜ 区间 ${fmt(lo)} ~ ${fmt(hi)} ｜ 分时数据：东方财富 push2</div>`;
}
