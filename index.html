17.73, 6617.73, 6617.73, 6617.73, 6617.73, 6617.73, 6617.73, 6617.73, 6627.26], "pre_close": 6684.37}}]}], "news": [{"title": "存储原厂削减2027-2028年配额，短缺预计加剧至2028年", "time": "2026-09-16 07:00:00", "source": "晨报", "url": "", "body": "内存供需与价格延续偏紧：存储原厂削减2027-2028年产能分配配额，三星与SK海力士预计短缺加剧至2028年；据产业链消息，苹果已接受三星2027年一季度报价，DRAM近2.0美元/Gb、NAND近0.33美元/Gb，较2026年三季度上涨30%-40%。对国内投资者而言，存储原厂、模组及服务器内存环节的涨价幅度与久期预期上修，但2027年二季度至年底价格见顶的分歧仍在。", "why": "原厂削减2027-2028年配额并抬升报价，涨价与久期预期上修：DRAM/HBM原厂为核心抓手，模组分销、服务器接口芯片与封测按兑现弹性递减；原厂产能转向HBM挤压通用供给，国产利基存储承接缺口。苹果等终端成本承压。2027年二季度至年底价格见顶分歧仍在，涨价久期是主要边界。", "tags": ["存储涨价久期"], "orig_time": "2026-09-16 07:00:00"}, {"title": "美债10年期收益率破5%创2007年新高，机构判断并非本轮终点", "time": "2026-09-16 07:00:00", "source": "晨报", "url": "", "body": "9月15日美国长端国债收益率续创新高，10年期一度升破5%、30年期盘中最高5.40%，均创2007年以来新高，日本10年期同步触及3.025%、为1996年9月以来最高。申万宏源宏观当日展望判断，中东局势僵局、AI融资扩张与强劲名义GDP令长端美债利率易上难下，5%并非本轮终点。全球无风险利率上沿抬升将持续压制A股与港股高估值成长、长久期资产的贴现率，机构前瞻判断亦存在落空风险。", "why": "核心变量是全球长端无风险利率上沿抬升：贴现率与风险溢价压制高估值、长久期资产，港股互联网/创新药与A股科技成长承压最直接；黄金同时受实际利率上行与美元财政信用担忧拉扯，呈多空交织；中美利差走扩则利好南向配置的港股高股息红利。机构“5%非终点”与9月FOMC为关键分水岭，判断落空链条反向。", "tags": ["长端利率上沿"], "orig_time": "2026-09-16 07:00:00"}, {"title": "气价高位共识强化，国内动力煤价重回千元上方", "time": "2026-09-16 07:00:00", "source": "晨报", "url": "", "body": "截至9月中旬，天然气与国内动力煤价格同步走强。欧洲以近年同期最低库存入冬，卡塔尔及中东LNG供应中断延续，机构预计2026年全球有效LNG供应同比下降，JKM约27美元/MMBtu、欧洲TTF月ahead约83欧元/兆瓦时，今冬气价高位已成机构共识；国内动力煤受矿难后安监趋严、供给收缩推动，价格重回1000元/吨上方。气、煤与油价逻辑分化，产业链盈利与估值预期随之抬升，核心变量是供应中断持续时间。", "why": "卡塔尔/中东LNG供应中断叠加欧洲低库存入冬，JKM与TTF高位，直接增厚上游气源与LNG贸易环节弹性；国内矿难后安监趋严推动动力煤重回千元，利好煤炭生产与煤化工一体化主体。核心变量是供应中断持续时间，城燃高气价成本与顺价节奏决定下游边界，地缘缓和及2028年后新增产能释放构成反向风险。", "tags": ["气煤价格双强"], "orig_time": "2026-09-16 07:00:00"}, {"title": "英伟达RTX 5090美国渠道断货，硬件多品类供给趋紧", "time": "2026-09-16 07:00:00", "source": "晨报", "url": "", "body": "上周美国市场英伟达RTX 5090官方现货库存枯竭，第三方卖家报价升至6500-9500美元；TrendForce同期提示除显卡外其他产品供应也比较紧张，缺货与涨价正由显卡向更广品类蔓延。晶圆制造、先进封装、内存、基板、DSP及射频、模拟、MLCC、CCL等环节供给偏紧，强化相关环节供需紧张与价格弹性预期，支撑盈利与估值；显卡报价属市场反馈。", "why": "RTX 5090美国断货提价，TrendForce同期称除显卡外多品类供应偏紧，核心变量为供给约束与涨价向存储、先进封装、被动元件、CCL、模拟射频、晶圆代工扩散。缺货与提价利好各环节价格弹性与盈利，存储为链条最强驱动；显卡主体受益定价权但显存成本上升。显卡报价属渠道市场反馈，多品类扩散的幅度与持续性尚待验证。", "tags": ["硬件缺货涨价"], "orig_time": "2026-09-16 07:00:00"}, {"title": "机构研判电子布缺织布机与缺纱延续至2028年，7628布年底看税后15元", "time": "2026-09-16 07:00:00", "source": "晨报", "url": "", "body": "9月15日多家机构集中更新电子布产业链研判：核心矛盾仍是织布机与电子纱供给不足，普通电子纱扩产周期约1.5年、且投资资源向AI电子纱倾斜，紧缺久期或延续至2028年。机构测算7628电子布2026年底税后价格有望达约15元/米、2027年不排除冲20元；AI端Low-DK二代布2026年缺口约12个百分点、年底或扩至20个点，并据此给出中国巨石目标市值约2700亿元、国际复材与中材科技约1600亿元。上述价格与缺口为机构预测。", "why": "核心变量是电子布价格与供需缺口：缺织布机与缺普通电子纱使紧缺久期看至2028年，7628布年底看税后15元。中国巨石、中材科技为量价最直接龙头；宏和科技、国际复材、建滔积层板承接AI二代布缺口弹性；织机短缺本身又催生国产替代链。价格与目标市值均为机构预测，非已实现事实。", "tags": ["电子布缺织机"], "orig_time": "2026-09-16 07:00:00"}, {"title": "美银上调半导体行业增速与晶圆设备支出预测", "time": "2026-09-16 07:00:00", "source": "晨报", "url": "", "body": "美国银行报告将2026—2030年半导体行业复合增速由14%上调至18%，2030年市场规模由2.7万亿美元上调至3.2万亿美元，并上修晶圆制造设备预测：2026年1560亿美元（同比+33%）、2027年2100亿美元（同比+34%），DRAM设备2026、2027年分别达610亿与850亿美元。驱动来自AI与数据中心订单、产能落地及内存资本开支提升，半导体设备与存储资本开支链景气预期抬升。", "why": "美银将2026—2030年半导体复合增速由14%上调至18%、晶圆设备2030年看至3600亿美元，其中DRAM设备为主要增量，直接抬升全球前道设备与存储扩产链景气；国产设备与核心零部件为衍生受益方向。需注意本质是卖方预测上修，订单兑现存在时滞，存储原厂扩产亦隐含远期供给增量。", "tags": ["晶圆设备上修"], "orig_time": "2026-09-16 07:00:00"}, {"title": "VLCC运价延续涨势，机构测算运费上限并判断中期高运价可持续", "time": "2026-09-16 07:00:00", "source": "晨报", "url": "", "body": "截至9月14日，霍尔木兹通行受阻与战争风险溢价推动油轮运价继续上行，BDTI升至4325点、西非-中国VLCC TCE达44.1万美元/天，主要VLCC航线TCE与一年期期租同步处于历史高位。申万宏源测算货主油轮运费理论上限约118美元/桶，认为海峡中断后的原油补库与“窄管效应”支撑中期相对高运价。运价至盈利传导方向清晰，利好中远海能、招商轮船与招商南油，但运价处于极端水平、随海峡通行与地缘局势变化波动风险较高。", "why": "霍尔木兹通行受阻与战争风险溢价把VLCC运价推至历史高位，运价→盈利传导直接、确定，弹性集中在掌握现货议价权的原油轮船东；原油轮紧平衡再向亚洲成品油轮扩散，成品油轮为衍生受益方向。需注意运价处极端水平、随海峡通行与地缘变化的剧烈波动风险。", "tags": ["油轮运价突破"], "orig_time": "2026-09-16 07:00:00"}, {"title": "甬矽电子CoWoS-L硅桥验证顺利，混合键合机交付台积电", "time": "2026-09-16 07:00:00", "source": "晨报", "url": "", "body": "市场交流信息称，甬矽电子CoWoS-L硅桥方案在头部国产算力客户验证顺利，当前产能约1000片/月，2026年底有望提升至2000-3000片/月、2027年下半年目标5000片/月，产能等细项尚未获正式披露印证。海外设备商披露，50nm混合键合机本月向台积电交付首台，逻辑芯片良率已超99.9%、HBM约90%，预计2028/29年 function renderSpark(series, color){
  if(!series || series.length<2) return '';
  const W=240,H=44,pad=4;
  const vals=series.map(s=>s[1]);
  const lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals), span=(hi-lo)||1;
  const n=series.length;
  const X=i=>pad+(W-2*pad)*(n>1?i/(n-1):0.5);
  const Y=v=>pad+(H-2*pad)*(1-(v-lo)/span);
  const pts=series.map((s,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(s[1]).toFixed(1)}`).join(' ');
  const c2=color||'#4d8dff';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${pts}" fill="none" stroke="${c2}" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="${X(n-1).toFixed(1)}" cy="${Y(vals[n-1]).toFixed(1)}" r="2.2" fill="${c2}"/></svg>`;
}

const fw = document.getElementById('floatwin');
const fbody = document.getElementById('floatBody');
let fwTimer = null;
function showFloat(html, anchor){
  fbody.innerHTML = html;
  fw.style.display = 'block';
  fw.style.visibility = 'hidden';
  const r = anchor.getBoundingClientRect();
  const fwW = fw.offsetWidth, fwH = fw.offsetHeight;
  const vw = window.innerWidth, vh = window.innerHeight;
  let left = r.left + r.width/2 - fwW/2;
  let top = r.bottom + 10;
  if(left < 8) left = 8;
  if(left + fwW > vw - 8) left = vw - fwW - 8;
  if(top + fwH > vh - 8) top = r.top - fwH - 10;
  if(top < 8) top = 8;
  fw.style.left = left + 'px';
  fw.style.top = top + 'px';
  fw.style.visibility = 'visible';
  clearTimeout(fwTimer);
}
function hideFloat(){ fwTimer = setTimeout(()=>{ fw.style.display='none'; }, 160); }
fw.addEventListener('mouseenter', ()=>clearTimeout(fwTimer));
fw.addEventListener('mouseleave', ()=>{ fw.style.display='none'; });

function indexFloatHtml(idx){
  const d = idx.intraday;
  const sub = `${idx.date||''} ｜ 收盘 ${fmt(idx.close)}（${sign(idx.pct)}${fmt(idx.pct)}%）｜ 东方财富分时`;

// 锚定资产历史走势浮窗（日线序列，非分时；期货/外汇 24h 连续交易，分时口径与卡片收盘不同源，故不采用分时）
function anchorFloatHtml(a){
  const isYield = a.kind==='yield';
  const unit = isYield ? '%' : '';
  const chg = isYield
    ? (a.bp==null?'--':(a.bp>0?'+':'')+fmt(a.bp,1)+' bp')
    : (a.pct==null?'--':sign(a.pct)+fmt(a.pct)+'%');
  const cur = a.value==null ? '--' : fmt(a.value)+unit;
  const n = (a.series||[]).length;
  const sub = `${a.date||''} ｜ ${isYield?'收益率':'收盘'} ${cur}（${chg}）｜ ${a.sub||''}`;
  return `<div class="fw-head">${a.label} 近 ${n} 个交易日走势</div><div class="fw-sub">${sub}</div>${renderAnchorTrend(a)}`;
}
function renderAnchorTrend(a){
  const s = (a.series||[]).filter(x=>x && x[1]!=null);
  if(s.length<2) return '<div class="nodata">暂无历史走势数据</div>';
  const W=640,H=300,padL=10,padR=10,padT=16,padB=26;
  const vals = s.map(x=>x[1]);
  const lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals), span=(hi-lo)||1;
  const n=s.length;
  const X=i=>padL+(W-padL-padR)*(n>1?i/(n-1):0.5);
  const Y=v=>padT+(H-padT-padB)*(1-(v-lo)/span);
  const dp = s.map((x,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(x[1]).toFixed(1)}`).join(' ');
  const fill = dp + ` L${X(n-1).toFixed(1)} ${(H-padB).toFixed(1)} L${X(0).toFixed(1)} ${(H-padB).toFixed(1)} Z`;
  const chgVal = a.kind==='yield' ? a.bp : a.pct;
  const color = (chgVal==null||chgVal>=0) ? '#ff4d4f' : '#2ecc71';
  const base = vals[0], yb = Y(base).toFixed(1);
  const unit = a.kind==='yield' ? '%' : '';
  const md = d => (d||'').slice(5);
  const xt = [0, Math.floor(n/2), n-1].filter((v,i,arr)=>arr.indexOf(v)===i);
  const ticks = xt.map(i=>`<text x="${X(i).toFixed(1)}" y="${H-8}" fill="#5f6c8e" font-size="11" text-anchor="${i===0?'start':(i===n-1?'end':'middle')}">${md(s[i][0])}</text>`).join('');
  return `<svg class="intra-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="0" y1="${Y(hi).toFixed(1)}" x2="${W}" y2="${Y(hi).toFixed(1)}" stroke="#243055" stroke-width="1"/>
    <line x1="0" y1="${Y(lo).toFixed(1)}" x2="${W}" y2="${Y(lo).toFixed(1)}" stroke="#243055" stroke-width="1"/>
    <line x1="0" y1="${yb}" x2="${W}" y2="${yb}" stroke="#5f6c8e" stroke-dasharray="3,3" stroke-width="1"/>
    <path d="${fill}" fill="${color}" opacity="0.12"/>
    <path d="${dp}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="4" y="${(Y(hi)+12).toFixed(1)}" fill="#9aa7c7" font-size="10">${fmt(hi)}${unit}</text>
    <text x="4" y="${(Y(lo)-4).toFixed(1)}" fill="#9aa7c7" font-size="10">${fmt(lo)}${unit}</text>
    <text x="4" y="${(parseFloat(yb)-4).toFixed(1)}" fill="#5f6c8e" font-size="10">起点 ${fmt(base)}${unit}</text>
    ${ticks}
  </svg>
  <div class="intra-legend">区间 ${fmt(lo)}${unit} ~ ${fmt(hi)}${unit} ｜ 共 ${n} 个交易日 ｜ 数据：${a.source==='em'?'东方财富':'Wind'}</div>`;
}
// 板块成分股浮窗
function sectorFloatHtml(r){
  const stocks = (r.stocks || []).slice(0,3);
  const yi = n=>n==null?'--':Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
  const sp = n=>n==null?'--':(n>0?'+':'')+Number(n).toFixed(2)+'%';
  const c = n=>(n==null?'flat-c':(n>0.0001?'up-c':(n<-0.0001?'down-c':'flat-c')));
  const isOut = (r.net_yi != null && r.net_yi < 0);
  const headLabel = isOut ? '主力净流出' : '主力净流入';
  const sub = `板块净流入 ${(r.net_yi==null?'--':(r.net_yi>0?'+':'')+yi(r.net_yi)+' 亿')}（净流入率 ${sp(r.net_pct)}）｜ 数据：东方财富`;
  let body;
  if(!stocks.length){
    body = '<div class="nodata">暂未获取到成分股数据</div>';
  } else {
    const rows = stocks.map((x,i)=>`<tr>
      <td><span class="stock-rank">${i+1}</span></td>
      <td>${x.name}</td>
      <td class="${c(x.pct)}">${sp(x.pct)}</td>
      <td class="${c(x.net_yi)}">${(x.net_yi==null?'--':(x.net_yi>0?'+':'')+yi(x.net_yi)+' 亿')}</td>
    </tr>`).join('');
    body = `<table class="stock-tbl"><thead><tr><th>#</th><th>个股</th><th>涨跌幅</th><th>主力净额(亿)</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  return `<div class="fw-head">${r.name} · ${headLabel}前 ${stocks.length||3} 个股</div><div class="fw-sub">${sub}</div>${body}`;
}
// 板块融资融券单栏浮窗：板块内融资净买入前3（clist 板块成员 ∩ 全市场两融榜，按 RZJME 降序）
function sectorMarginFloatHtml(r){
  const yi = n=>n==null?'--':Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
  const c = n=>(n==null?'flat-c':(n>0.0001?'up-c':(n<-0.0001?'down-c':'flat-c')));
  const is3d = r.period === '3d';
  const netLabel = is3d ? '近3日合计(亿)' : '融资净买入(亿)';
  const subPrefix = is3d ? '近3日融资净买入' : '当日融资净买入';
  const headLabel = is3d ? '板块内近3日融资净买入前3' : '板块内融资净买入前3';
  const emptyMsg = is3d ? '该板块近3日暂无融资净买入个股数据' : '该板块当日暂无融资净买入个股数据';
  const sub = `行业板块 ｜ ${subPrefix} ${(r.net_yi==null?'--':(r.net_yi>0?'+':'')+yi(r.net_yi)+' 亿')} ｜ 融资余额 ${yi(r.balance_yi)} 亿 ｜ 数据：东方财富`;
  const mgn = (r.stocks||[]).slice(0,3);
  const body = !mgn.length ? `<div class="nodata">${emptyMsg}</div>` :
    `<table class="stock-tbl"><thead><tr><th>#</th><th>个股</th><th>${netLabel}</th><th>融资余额(亿)</th></tr></thead><tbody>` +
    mgn.map((x,i)=>`<tr><td><span class="stock-rank">${i+1}</span></td><td>${x.name||'--'}</td><td class="${c(x.net_yi)}">${(x.net_yi==null?'--':(x.net_yi>0?'+':'')+yi(x.net_yi)+' 亿')}</td><td>${yi(x.balance_yi)}</td></tr>`).join('') +
    '</tbody></table>';
  return `<div class="fw-head">${r.name} · ${headLabel}</div><div class="fw-sub">${sub}</div>${body}`;
}
// 板块行 hover 绑定
(function(){
  const s = DATA.sector || {};
  const all = [].concat(s.inflow||[], s.outflow||[]);
  document.querySelectorAll('#sgrid .srow.clickable').forEach(row=>{
    const bk = row.getAttribute('data-bk');
    const r = all.find(x=>x.bk===bk);
    if(!r) return;
    row.addEventListener('mouseenter', ()=>showFloat(sectorFloatHtml(r), row));
    row.addEventListener('mouseleave', hideFloat);
  });
})();

// 内联 SVG 画分时折线（零外部依赖）
function renderIntra(d, idx){
  if(!d || !d.vals || !d.vals.length) return '<div class="nodata">暂无分时数据</div>';
  const W=640,H=300,padL=10,padR=10,padT=16,padB=26;
  const vals = d.vals.filter(v=>v!=null);
  if(!vals.length) return '<div class="nodata">暂无分时数据</div>';
  const base = (d.pre_close!=null)? d.pre_close : vals[0];
  const lo = Math.min.apply(null, vals.concat([base]));
  const hi = Math.max.apply(null, vals.concat([base]));
  const span = (hi-lo)||1;
  const n = d.vals.length;
  const X = i => padL + (W-padL-padR)*(n>1 ? i/(n-1) : 0.5);
  const Y = v => padT + (H-padT-padB)*(1-(v-lo)/span);
  const pts = d.vals.map((v,i)=> (v==null? null : [X(i),Y(v)]));
  let dp='', started=false;
  pts.forEach(p=>{ if(p==null){started=false;return;} dp += (started?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)+' '; started=true; });
  const fill = dp + `L${X(n-1).toFixed(1)} ${(H-padB).toFixed(1)} L${X(0).toFixed(1)} ${(H-padB).toFixed(1)} Z`;
  const color = (idx.pct==null||idx.pct>=0)? '#ff4d4f' : '#2ecc71';
  const yb = Y(base).toFixed(1);
  const xticks = [0, Math.floor(n/2), n-1].filter((v,i,a)=>a.indexOf(v)===i);
  const ticks = xticks.map(i=>`<text x="${X(i).toFixed(1)}" y="${H-8}" fill="#5f6c8e" font-size="11" text-anchor="${i===0?'start':(i===n-1?'end':'middle')}">${d.times[i]||''}</text>`).join('');
  const yTop = Y(hi).toFixed(1), yBot = Y(lo).toFixed(1);
  return `<svg class="intra-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="0" y1="${yTop}" x2="${W}" y2="${yTop}" stroke="#243055" stroke-width="1"/>
    <line x1="0" y1="${yBot}" x2="${W}" y2="${yBot}" stroke="#243055" stroke-width="1"/>
    <line x1="0" y1="${yb}" x2="${W}" y2="${yb}" stroke="#5f6c8e" stroke-dasharray="3,3" stroke-width="1"/>
    <path d="${fill}" fill="${color}" opacity="0.12"/>
    <path d="${dp}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="4" y="${(Y(hi)+12).toFixed(1)}" fill="#9aa7c7" font-size="10">${fmt(hi)}</text>
    <text x="4" y="${(Y(lo)-4).toFixed(1)}" fill="#9aa7c7" font-size="10">${fmt(lo)}</text>
    <text x="4" y="${(parseFloat(yb)-4).toFixed(1)}" fill="#5f6c8e" font-size="10">昨收 ${fmt(base)}</text>
    ${ticks}
  </svg>
  <div class="intra-legend">昨收 <b>${fmt(base)}</b> ｜ 区间 ${fmt(lo)} ~ ${fmt(hi)} ｜ 分时数据：东方财富 push2</div>`;
}
