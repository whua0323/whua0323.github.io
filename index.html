<style>
  :root{
    --bg:#0b1020; --bg2:#0f162e; --card:#141c36; --card-hover:#1a2444;
    --border:#243055; --text:#e8ecf5; --text2:#9aa7c7; --text3:#5f6c8e;
    --up:#ff4d4f; --up-bg:rgba(255,77,79,.10); --down:#2ecc71; --down-bg:rgba(46,204,113,.10);
    --accent:#4d8dff; --gold:#e6b45a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(77,141,255,.12), transparent 60%),
      radial-gradient(900px 400px at 0% 0%, rgba(230,180,90,.07), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    min-height:100vh; padding-bottom:60px;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}

  /* ---------- Header ---------- */
  header{padding:38px 0 10px}
  h1{font-size:30px;font-weight:700;letter-spacing:1px}
  h1 .date{color:var(--accent)}
  .sub{margin-top:8px;color:var(--text2);font-size:13px;display:flex;gap:18px;flex-wrap:wrap}
  .sub span b{color:var(--text);font-weight:600}

  /* ---------- Sections ---------- */
  section{margin-top:34px}
  .sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
  .sec-head h2{font-size:19px;font-weight:700}
  .sec-head .bar{width:4px;height:18px;border-radius:2px;background:var(--accent);align-self:center}
  .sec-head .note{font-size:12px;color:var(--text3)}

  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:stretch}

  /* ---------- Index card ---------- */
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 15px 10px;
    position:relative;overflow:hidden;opacity:0;transform:translateY(24px);
    transition:border-color .25s, box-shadow .25s, background .25s;
    display:flex;flex-direction:column;min-height:126px}
  .card.show{animation:rise .55s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .card:hover{border-color:#33437a;background:var(--card-hover);box-shadow:0 8px 30px rgba(0,0,0,.35)}
  .card.clickable{cursor:pointer}
  .card.clickable:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,0 8px 30px rgba(0,0,0,.35)}
  .card.clickable::after{content:"分时 ＞";position:absolute;right:10px;bottom:8px;font-size:10px;color:var(--accent);opacity:0;transition:opacity .2s}
  .card.clickable:hover::after{opacity:.9}
  .card.anchor-card.clickable::after{content:"走势 ＞"}

  /* ---------- 浮窗（hover 浮层） ---------- */
  .floatwin{position:fixed;z-index:1000;display:none;max-width:92vw;
    background:var(--card);border:1px solid var(--accent);border-radius:12px;
    box-shadow:0 18px 50px rgba(0,0,0,.55);padding:14px 16px;animation:fwIn .14s ease}
  @keyframes fwIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .fw-head{font-size:14px;font-weight:700;margin-bottom:2px}
  .fw-sub{font-size:11.5px;color:var(--text3);margin-bottom:8px}
  .srow.clickable{cursor:pointer}
  .srow.clickable:hover{background:var(--card-hover);box-shadow:0 0 0 1px var(--accent) inset}
  .intra-chart{width:100%;height:300px;display:block}
  .intra-legend{font-size:12px;color:var(--text2);margin-top:8px;line-height:1.7}
  .stock-tbl{width:100%;border-collapse:collapse;font-size:13px}
  .stock-tbl th,.stock-tbl td{padding:10px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
  .stock-tbl th{color:var(--text3);font-weight:600;font-size:12px}
  .stock-tbl td:first-child,.stock-tbl th:first-child{text-align:left;width:30px}
  .stock-tbl td:nth-child(2),.stock-tbl th:nth-child(2){text-align:left;color:var(--text);font-weight:600}
  .stock-rank{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--border);
    color:var(--text);align-items:center;justify-content:center;font-size:11px;font-weight:700}
  .nodata{color:var(--text3);font-size:13px;padding:14px 0}
  .card .stripe{position:absolute;top:0;left:0;right:0;height:3px}
  .card.up .stripe{background:linear-gradient(90deg,var(--up),transparent)}
  .card.down .stripe{background:linear-gradient(90deg,var(--down),transparent)}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start}
  .idx-name{font-size:15px;font-weight:700}
  .idx-code{font-size:11px;color:var(--text3);margin-top:2px;letter-spacing:.5px}
  .pct-pill{font-size:13px;font-weight:700;border-radius:7px;padding:3px 9px;font-variant-numeric:tabular-nums}
  .up .pct-pill{color:var(--up);background:var(--up-bg)}
  .down .pct-pill{color:var(--down);background:var(--down-bg)}
  .flat .pct-pill{color:var(--text2);background:rgba(154,167,199,.1)}
  .price-row{margin-top:9px;display:flex;align-items:baseline;gap:10px}
  .price{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px}
  .chg{font-size:12px;font-variant-numeric:tabular-nums}
  .up .price,.up .chg{color:var(--up)} .down .price,.down .chg{color:var(--down)}
  .flat .price,.flat .chg{color:var(--text2)}
  .meta-row{margin-top:auto;padding-top:8px;font-size:11px;color:var(--text3);display:flex;gap:12px;align-items:flex-end}

  /* ---------- 锚定资产 / 美股个股 附加样式 ---------- */
  .sub-head{display:flex;align-items:center;gap:10px;margin:18px 0 12px;font-size:14px;font-weight:700;color:var(--text)}
  .sub-head .sub-note{font-size:11.5px;color:var(--text3);font-weight:500}
  .sub-head::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--gold)}

  /* ---------- 美股代表性个股：紧凑行表 ---------- */
  .ustk-tbl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
  .ustk-row{display:grid;grid-template-columns:8px minmax(0,1fr) auto auto;align-items:center;gap:10px;
    padding:8px 12px;border-radius:8px;background:var(--card);border:1px solid var(--border);
    opacity:0;transform:translateY(6px);transition:opacity .35s ease,transform .35s ease,border-color .2s,background .2s}
  .ustk-row.show{opacity:1;transform:none}
  .ustk-row.clickable{cursor:pointer}
  .ustk-row.clickable:hover{border-color:var(--gold);background:var(--card-hover)}
  .ustk-dot{width:8px;height:8px;border-radius:50%;background:var(--text3)}
  .ustk-row.up .ustk-dot{background:var(--up)}
  .ustk-row.down .ustk-dot{background:var(--down)}
  .ustk-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ustk-name .ustk-ex{margin-left:6px;font-size:10px;font-weight:500;color:var(--text3);
    border:1px solid var(--border);border-radius:3px;padding:1px 4px}
  .ustk-px{font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums;text-align:right;min-width:64px}
  .ustk-pct{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:64px;color:var(--text3)}
  .ustk-row.up .ustk-pct{color:var(--up)}
  .ustk-row.down .ustk-pct{color:var(--down)}
  @media(max-width:760px){.ustk-tbl{grid-template-columns:1fr}}

  .spark-wrap{margin-top:6px;padding-top:4px}
  .spark{width:100%;height:38px;display:block}

  /* ---------- Margin (融资融券) ---------- */
  .mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:stretch}
  .mcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 15px 12px;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:132px}
  .mcard .stripe{position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#a78bfa,transparent)}
  .mlabel{font-size:12.5px;color:var(--text2);font-weight:600}
  .mval{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:6px;letter-spacing:.3px}
  .mchg{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:5px}
  .msub{font-size:11.5px;color:var(--text3);margin-top:7px;display:flex;gap:14px;flex-wrap:wrap}
  .msub:last-child{margin-top:auto;padding-top:10px}
  .up-c{color:var(--up)} .down-c{color:var(--down)} .flat-c{color:var(--text2)}
  .mchart-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:14px}
  .mchart-title{font-size:13px;color:var(--text2);font-weight:600;margin-bottom:6px}
  .mchart-title b{color:var(--text)}
  #marginTrend{min-height:175px}
  #marginTrend img.mchart-img{width:100%;height:auto;display:block;border-radius:6px}

  /* ---------- Sector fund flow (板块资金流向) ---------- */
  .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .scol{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .scol-title{font-size:13px;font-weight:700;padding:11px 16px 9px;display:flex;align-items:center;gap:8px;
    border-bottom:1px solid var(--border)}
  .scol-title.in{color:var(--up)} .scol-title.out{color:var(--down)}
  .srow{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;
    padding:10px 16px;border-top:1px solid var(--border);font-variant-numeric:tabular-nums}
  .srow:hover{background:var(--card-hover)}
  .srank{font-size:13px;font-weight:700;color:var(--text3);text-align:center}
  .sname{font-size:14px;font-weight:600}
  .spct{font-size:11.5px;color:var(--text3);margin-top:2px}
  .sval{text-align:right;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
  .sval .sub{font-size:11px;color:var(--text3);font-weight:500;margin-top:2px}
  .scol.in .sval{color:var(--up)} .scol.out .sval{color:var(--down)}

  /* ---------- News timeline ---------- */
  .news-list{position:relative;margin-left:6px;padding-left:26px;border-left:1px solid var(--border)}
  .news{position:relative;padding:13px 16px;margin-bottom:10px;background:var(--card);
    border:1px solid var(--border);border-radius:12px;opacity:0;transform:translateY(16px);
    transition:border-color .25s;cursor:pointer}
  .news.show{animation:rise .5s ease forwards}
  .news:hover{border-color:#33437a}
  .news::before{content:"";position:absolute;left:-31px;top:20px;width:9px;height:9px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 4px rgba(77,141,255,.18)}
  .news .n-time{font-size:12px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
  .news .n-title{font-size:14.5px;font-weight:600;margin-top:4px;line-height:1.55}
  .news .n-title a{color:var(--text);text-decoration:none}
  .news .n-title a:hover{color:var(--accent)}
  .news .n-body{font-size:13px;color:var(--text2);margin-top:5px;line-height:1.7}
  .news .n-why{font-size:12.5px;color:var(--text2);margin-top:8px;padding:7px 10px;background:rgba(56,189,248,.08);
    border-left:3px solid var(--accent);border-radius:0 6px 6px 0;line-height:1.65}
  .news .n-why b{color:var(--accent);font-weight:700}
  .news .n-tags{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
  .n-tag{font-size:11px;padding:2px 9px;border-radius:20px;background:rgba(77,141,255,.14);
    color:#8fb4ff;border:1px solid rgba(77,141,255,.32);font-weight:600;letter-spacing:.3px}
  .n-detail{max-height:0;opacity:0;overflow:hidden;transition:max-height .35s ease,opacity .3s;margin-top:0}
  .news.expanded .n-detail{max-height:1600px;opacity:1;margin-top:6px}
  .n-toggle{font-size:11px;color:var(--accent);margin-top:9px;font-weight:600;
    user-select:none;letter-spacing:.5px;display:flex;align-items:center;gap:4px}
  .n-toggle::after{content:"";width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;
    border-top:5px solid var(--accent);transition:transform .3s}
  .news.expanded .n-toggle::after{transform:rotate(180deg)}
  .news .n-src{font-size:11px;color:var(--text3);margin-top:6px}

  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--border);
    color:var(--text3);font-size:11.5px;line-height:2}
  @media (max-width:900px){
    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:560px){
    h1{font-size:22px} .grid{grid-template-columns:1fr}
    .mgrid{grid-template-columns:1fr}
    .ov-item{border-right:none;border-bottom:1px solid var(--border);padding:10px 4px}
  }
</style>

/* ---------- index cards ---------- */
function buildCard(idx, container, delay){
  const c = cls(idx.pct);
  const el = document.createElement('div');
  el.className = 'card '+c;
  el.innerHTML = `
    <div class="stripe"></div>
    <div class="card-top">
      <div><div class="idx-name">${idx.name}</div><div class="idx-code">${idx.code} · ${idx.date||'--'}</div></div>
      <div class="pct-pill">${idx.pct==null?'--':sign(idx.pct)+fmt(idx.pct)+'%'}</div>
    </div>
    <div class="price-row">
      <div class="price" data-target="${idx.close??''}">${idx.close==null?'--':'0.00'}</div>
      <div class="chg">${idx.chg==null?'':sign(idx.chg)+fmt(idx.chg)+' 点'}</div>
    </div>
    <div class="meta-row">
      ${idx.high!=null?`<span>高 ${fmt(idx.high)}</span>`:''}
      ${idx.low!=null?`<span>低 ${fmt(idx.low)}</span>`:''}
      ${idx.range20!=null?`<span title="近20个交易日累计涨跌幅：以最新收盘价相对20个交易日前收盘价的涨跌幅度">近20日累计 ${sign(idx.range20)}${fmt(idx.range20)}%</span>`:''}
    </div>
  `;
  container.appendChild(el);
  setTimeout(()=>el.classList.add('show'), delay);
  if(idx.secid && idx.intraday){
    el.classList.add('clickable');
    el.title = '鼠标悬停查看分时走势';
    el.addEventListener('mouseenter', ()=>showFloat(indexFloatHtml(idx), el));
    el.addEventListener('mouseleave', hideFloat);
  }

  /* count-up */
  const priceEl = el.querySelector('.price');
  if(idx.close!=null){
    const target=idx.close, dur=900, t0=performance.now();
    (function tick(t){
      const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
      priceEl.textContent = fmt(target*e);
      if(k<1) requestAnimationFrame(tick); else priceEl.textContent=fmt(target);
    })(t0);
  }

}

function renderSpark(series, color){
  if(!series || series.length<2) return '';
  const W=240,H=44,pad=4;
  const vals=series.map(s=>s[1]);
  const lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals), span=(hi-lo)||1;
  const n=series.length;
  const X=i=>pad+(W-2*pad)*(n>1?i/(n-1):0.5);
  const Y=v=>pad+(H-2*pad)*(1-(v-lo)/span);
  const pts=series.map((s,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(s[1]).toFixed(1)}`).join(' ');
  const c2=color||'#4d8dff';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${pts}" fill="none" stroke="${c2}" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="${X(n-1).toFixed(1)}" cy="${Y(vals[n-1]).toFixed(1)}" r="2.2" fill="${c2}"/></svg>`;
}
function buildAnchorCard(a, container, delay){
  const isYield = a.kind==='yield';
  const chgVal = isYield ? a.bp : a.pct;
  const c = cls(chgVal);
  const color2 = c==='up'?'#ff4d4f':(c==='down'?'#2ecc71':'#4d8dff');
  const el=document.createElement('div'); el.className='card '+c;
  let valHtml, chgHtml;
  if(isYield){
    valHtml = `<div class="price">${a.value==null?'--':fmt(a.value)+'%'}</div>`;
    chgHtml = a.bp==null? '' : `<div class="chg">${(a.bp>0?'+':'')+fmt(a.bp,1)} bp</div>`;
  } else {
    valHtml = `<div class="price">${a.value==null?'--':fmt(a.value)}</div>`;
    chgHtml = a.pct==null? '' : `<div class="chg">${sign(a.pct)+fmt(a.pct)+'%'}</div>`;
  }
  const pill = isYield ? (a.bp==null?'--':(a.bp>0?'+':'')+fmt(a.bp,1)+'bp') : (a.pct==null?'--':sign(a.pct)+fmt(a.pct)+'%');
  // 走势图不再画在卡片上，移入 hover 浮窗（卡面只保留数值与涨跌）
  el.innerHTML = `
    <div class="stripe"></div>
    <div class="card-top">
      <div><div class="idx-name">${a.label}</div><div class="idx-code">${a.sub}</div></div>
      <div class="pct-pill">${pill}</div>
    </div>
    <div class="price-row">${valHtml}${chgHtml}</div>
    <div class="meta-row"><span>${a.date||'--'}</span>${a.high!=null?`<span>高 ${fmt(a.high)}</span>`:''}${a.low!=null?`<span>低 ${fmt(a.low)}</span>`:''}</div>`;
  container.appendChild(el);
  setTimeout(()=>el.classList.add('show'), delay);
  if(a.series && a.series.length>1){
    el.classList.add('clickable','anchor-card');
    el.title = '鼠标悬停查看历史走势';
    el.addEventListener('mouseenter', ()=>showFloat(anchorFloatHtml(a), el));
    el.addEventListener('mouseleave', hideFloat);
  }
  const priceEl=el.querySelector('.price');
  if(a.value!=null && !isYield){
    const target=a.value, dur=900,t0=performance.now();
    (function tick(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);priceEl.textContent=fmt(target*e);if(k<1)requestAnimationFrame(tick);else priceEl.textContent=fmt(target);})(t0);
  }
}

/* ---------- 美股个股卡片（复用指数分时浮窗） ---------- */

  const el=document.createElement('div'); el.className='card '+c;
  el.innerHTML=`
    <div class="stripe"></div>
    <div class="card-top">
      <div><div class="idx-name">${s.name}</div><div class="idx-code">${s.code} · ${s.secid}</div></div>
      <div class="pct-pill">${s.pct==null?'--':sign(s.pct)+fmt(s.pct)+'%'}</div>
    </div>
    <div class="price-row">
      <div class="price" data-target="${s.close??''}">${s.close==null?'--':'0.00'}</div>

    </div>
    <div class="meta-row">
      ${s.high!=null?`<span>高 ${fmt(s.high)}</span>`:''}

  setTimeout(()=>el.classList.add('show'), delay);

}

}

/* ---------- 锚定资产 / 美股个股 渲染 ---------- */
(function(){
  const a=DATA.anchors||[];
  const ga=document.getElementById('gridAnchor');
  if(ga){ if(!a.length) ga.innerHTML='<div class="nodata">暂无数据</div>';
    else a.forEach((x,i)=>buildAnchorCard(x, ga, 120*i+80)); }
  const s=DATA.us_stocks||[];
  const gs=document.getElementById('gridUSStocks');
  if(gs){ if(!s.length) gs.innerHTML='<div class="nodata">暂无数据</div>';

               .forEach((x,i)=>buildStockRow(x, gs, 45*i+80)); }

/* ---------- footer ---------- */
document.getElementById('footer').innerHTML = DATA.footer_html;

/* ---------- 浮窗（hover 浮层：指数分时 / 板块成分股） ---------- */
const fw = document.getElementById('floatwin');
const fbody = document.getElementById('floatBody');
let fwTimer = null;
function showFloat(html, anchor){
  fbody.innerHTML = html;
  fw.style.display = 'block';
  fw.style.visibility = 'hidden';
  const r = anchor.getBoundingClientRect();
  const fwW = fw.offsetWidth, fwH = fw.offsetHeight;
  const vw = window.innerWidth, vh = window.innerHeight;
  let left = r.left + r.width/2 - fwW/2;
  let top = r.bottom + 10;
  if(left < 8) left = 8;
  if(left + fwW > vw - 8) left = vw - fwW - 8;
  if(top + fwH > vh - 8) top = r.top - fwH - 10;
  if(top < 8) top = 8;
  fw.style.left = left + 'px';
  fw.style.top = top + 'px';
  fw.style.visibility = 'visible';
  clearTimeout(fwTimer);
}
function hideFloat(){ fwTimer = setTimeout(()=>{ fw.style.display='none'; }, 160); }
fw.addEventListener('mouseenter', ()=>clearTimeout(fwTimer));
fw.addEventListener('mouseleave', ()=>{ fw.style.display='none'; });

// 指数分时浮窗
function indexFloatHtml(idx){
  const d = idx.intraday;
  const sub = `${idx.date||''} ｜ 收盘 ${fmt(idx.close)}（${sign(idx.pct)}${fmt(idx.pct)}%）｜ 东方财富分时`;
  return `<div class="fw-head">${idx.name} 分时走势</div><div class="fw-sub">${sub}</div>${renderIntra(d, idx)}`;
}
// 锚定资产历史走势浮窗（日线序列，非分时；期货/外汇 24h 连续交易，分时口径与卡片收盘不同源，故不采用分时）
function anchorFloatHtml(a){
  const isYield = a.kind==='yield';
  const unit = isYield ? '%' : '';
  const chg = isYield
    ? (a.bp==null?'--':(a.bp>0?'+':'')+fmt(a.bp,1)+' bp')
    : (a.pct==null?'--':sign(a.pct)+fmt(a.pct)+'%');
  const cur = a.value==null ? '--' : fmt(a.value)+unit;
  const n = (a.series||[]).length;
  const sub = `${a.date||''} ｜ ${isYield?'收益率':'收盘'} ${cur}（${chg}）｜ ${a.sub||''}`;
  return `<div class="fw-head">${a.label} 近 ${n} 个交易日走势</div><div class="fw-sub">${sub}</div>${renderAnchorTrend(a)}`;
}
function renderAnchorTrend(a){
  const s = (a.series||[]).filter(x=>x && x[1]!=null);
  if(s.length<2) return '<div class="nodata">暂无历史走势数据</div>';
  const W=640,H=300,padL=10,padR=10,padT=16,padB=26;
  const vals = s.map(x=>x[1]);
  const lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals), span=(hi-lo)||1;
  const n=s.length;
  const X=i=>padL+(W-padL-padR)*(n>1?i/(n-1):0.5);
  const Y=v=>padT+(H-padT-padB)*(1-(v-lo)/span);
  const dp = s.map((x,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(x[1]).toFixed(1)}`).join(' ');
  const fill = dp + ` L${X(n-1).toFixed(1)} ${(H-padB).toFixed(1)} L${X(0).toFixed(1)} ${(H-padB).toFixed(1)} Z`;
  const chgVal = a.kind==='yield' ? a.bp : a.pct;
  const color = (chgVal==null||chgVal>=0) ? '#ff4d4f' : '#2ecc71';
  const base = vals[0], yb = Y(base).toFixed(1);
  const unit = a.kind==='yield' ? '%' : '';
  const md = d => (d||'').slice(5);
  const xt = [0, Math.floor(n/2), n-1].filter((v,i,arr)=>arr.indexOf(v)===i);
  const ticks = xt.map(i=>`<text x="${X(i).toFixed(1)}" y="${H-8}" fill="#5f6c8e" font-size="11" text-anchor="${i===0?'start':(i===n-1?'end':'middle')}">${md(s[i][0])}</text>`).join('');
  return `<svg class="intra-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="0" y1="${Y(hi).toFixed(1)}" x2="${W}" y2="${Y(hi).toFixed(1)}" stroke="#243055" stroke-width="1"/>
    <line x1="0" y1="${Y(lo).toFixed(1)}" x2="${W}" y2="${Y(lo).toFixed(1)}" stroke="#243055" stroke-width="1"/>
    <line x1="0" y1="${yb}" x2="${W}" y2="${yb}" stroke="#5f6c8e" stroke-dasharray="3,3" stroke-width="1"/>
    <path d="${fill}" fill="${color}" opacity="0.12"/>
    <path d="${dp}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="4" y="${(Y(hi)+12).toFixed(1)}" fill="#9aa7c7" font-size="10">${fmt(hi)}${unit}</text>
    <text x="4" y="${(Y(lo)-4).toFixed(1)}" fill="#9aa7c7" font-size="10">${fmt(lo)}${unit}</text>
    <text x="4" y="${(parseFloat(yb)-4).toFixed(1)}" fill="#5f6c8e" font-size="10">起点 ${fmt(base)}${unit}</text>
    ${ticks}
  </svg>
  <div class="intra-legend">区间 ${fmt(lo)}${unit} ~ ${fmt(hi)}${unit} ｜ 共 ${n} 个交易日 ｜ 数据：${a.source==='em'?'东方财富':'Wind'}</div>`;
}
// 板块成分股浮窗
function sectorFloatHtml(r){
  const stocks = (r.stocks || []).slice(0,3);
  const yi = n=>n==null?'--':Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
  const sp = n=>n==null?'--':(n>0?'+':'')+Number(n).toFixed(2)+'%';
  const c = n=>(n==null?'flat-c':(n>0.0001?'up-c':(n<-0.0001?'down-c':'flat-c')));
  const isOut = (r.net_yi != null && r.net_yi < 0);
  const headLabel = isOut ? '主力净流出' : '主力净流入';
  const sub = `板块净流入 ${(r.net_yi==null?'--':(r.net_yi>0?'+':'')+yi(r.net_yi)+' 亿')}（净流入率 ${sp(r.net_pct)}）｜ 数据：东方财富`;
  let body;
  if(!stocks.length){
    body = '<div class="nodata">暂未获取到成分股数据</div>';
  } else {
    const rows = stocks.map((x,i)=>`<tr>
      <td><span class="stock-rank">${i+1}</span></td>
      <td>${x.name}</td>
      <td class="${c(x.pct)}">${sp(x.pct)}</td>
      <td class="${c(x.net_yi)}">${(x.net_yi==null?'--':(x.net_yi>0?'+':'')+yi(x.net_yi)+' 亿')}</td>
    </tr>`).join('');
    body = `<table class="stock-tbl"><thead><tr><th>#</th><th>个股</th><th>涨跌幅</th><th>主力净额(亿)</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  return `<div class="fw-head">${r.name} · ${headLabel}前 ${stocks.length||3} 个股</div><div class="fw-sub">${sub}</div>${body}`;
}
// 板块行 hover 绑定
(function(){
  const s = DATA.sector || {};
  const all = [].concat(s.inflow||[], s.outflow||[]);
  document.querySelectorAll('#sgrid .srow.clickable').forEach(row=>{
    const bk = row.getAttribute('data-bk');
    const r = all.find(x=>x.bk===bk);
    if(!r) return;
    row.addEventListener('mouseenter', ()=>showFloat(sectorFloatHtml(r), row));
    row.addEventListener('mouseleave', hideFloat);
  });
})();

// 内联 SVG 画分时折线（零外部依赖）
function renderIntra(d, idx){
  if(!d || !d.vals || !d.vals.length) return '<div class="nodata">暂无分时数据</div>';
  const W=640,H=300,padL=10,padR=10,padT=16,padB=26;
  const vals = d.vals.filter(v=>v!=null);
  if(!vals.length) return '<div class="nodata">暂无分时数据</div>';
  const base = (d.pre_close!=null)? d.pre_close : vals[0];
  const lo = Math.min.apply(null, vals.concat([base]));
  const hi = Math.max.apply(null, vals.concat([base]));
  const span = (hi-lo)||1;
  const n = d.vals.length;
  const X = i => padL + (W-padL-padR)*(n>1 ? i/(n-1) : 0.5);
  const Y = v => padT + (H-padT-padB)*(1-(v-lo)/span);
  const pts = d.vals.map((v,i)=> (v==null? null : [X(i),Y(v)]));
  let dp='', started=false;
  pts.forEach(p=>{ if(p==null){started=false;return;} dp += (started?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)+' '; started=true; });
  const fill = dp + `L${X(n-1).toFixed(1)} ${(H-padB).toFixed(1)} L${X(0).toFixed(1)} ${(H-padB).toFixed(1)} Z`;
  const color = (idx.pct==null||idx.pct>=0)? '#ff4d4f' : '#2ecc71';
  const yb = Y(base).toFixed(1);
  const xticks = [0, Math.floor(n/2), n-1].filter((v,i,a)=>a.indexOf(v)===i);
  const ticks = xticks.map(i=>`<text x="${X(i).toFixed(1)}" y="${H-8}" fill="#5f6c8e" font-size="11" text-anchor="${i===0?'start':(i===n-1?'end':'middle')}">${d.times[i]||''}</text>`).join('');
  const yTop = Y(hi).toFixed(1), yBot = Y(lo).toFixed(1);
  return `<svg class="intra-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="0" y1="${yTop}" x2="${W}" y2="${yTop}" stroke="#243055" stroke-width="1"/>
    <line x1="0" y1="${yBot}" x2="${W}" y2="${yBot}" stroke="#243055" stroke-width="1"/>
    <line x1="0" y1="${yb}" x2="${W}" y2="${yb}" stroke="#5f6c8e" stroke-dasharray="3,3" stroke-width="1"/>
    <path d="${fill}" fill="${color}" opacity="0.12"/>
    <path d="${dp}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="4" y="${(Y(hi)+12).toFixed(1)}" fill="#9aa7c7" font-size="10">${fmt(hi)}</text>
    <text x="4" y="${(Y(lo)-4).toFixed(1)}" fill="#9aa7c7" font-size="10">${fmt(lo)}</text>
    <text x="4" y="${(parseFloat(yb)-4).toFixed(1)}" fill="#5f6c8e" font-size="10">昨收 ${fmt(base)}</text>
    ${ticks}
  </svg>
  <div class="intra-legend">昨收 <b>${fmt(base)}</b> ｜ 区间 ${fmt(lo)} ~ ${fmt(hi)} ｜ 分时数据：东方财富 push2</div>`;
}
